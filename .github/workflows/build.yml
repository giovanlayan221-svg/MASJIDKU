name: Build APK dan unggah ke Release

# Berjalan HANYA saat sebuah Release dipublikasikan (tidak lagi tiap push).
# Hasilnya (APK) otomatis terlampir di halaman Release itu.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek (ekstrak zip otomatis jika ada)
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -iname '*masjidku*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          fi
          if [ -n "$ZIP" ]; then
            echo "Mengekstrak $ZIP"
            mkdir -p _proj
            unzip -q -o "$ZIP" -d _proj
            SETTINGS=$(find _proj -name settings.gradle.kts | head -n 1)
          else
            SETTINGS=$(find . -maxdepth 2 -name settings.gradle.kts | head -n 1)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts tidak ditemukan. Pastikan zip proyek ada di akar repo."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Folder proyek: $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unduh data Al-Qur'an (equran.id) ke assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 scripts/fetch_quran.py

      - name: Cache audio murottal
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/murottal
          key: murottal-v1-${{ vars.QARI_KEY || '05' }}-${{ vars.AUDIO_KBPS || '40' }}

      - name: Pasang ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Unduh dan kompres audio murottal
        id: audio
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          QARI_KEY: ${{ vars.QARI_KEY }}
          AUDIO_KBPS: ${{ vars.AUDIO_KBPS }}
        run: python3 scripts/fetch_audio.py

      - name: Unduh doa dan dzikir
        id: dua
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 scripts/fetch_dua.py

      - name: Unduh adzan berlisensi terbuka (Commons + rekaman pencipta, lisensi diperiksa)
        id: adzan_open
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_adzan.py
          cat app/src/main/assets/adzan/license_check.json

      - name: Pasang file adzan (opsional, dari variabel ADZAN_URL)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ADZAN_URL: ${{ vars.ADZAN_URL }}
        run: |
          if [ -n "$ADZAN_URL" ]; then
            curl -fL "$ADZAN_URL" -o app/src/main/assets/adzan.mp3
            ls -lh app/src/main/assets/adzan.mp3
          elif [ -f app/src/main/assets/adzan.mp3 ]; then
            echo "Memakai adzan.mp3 yang ada di proyek"
          else
            echo "adzan.mp3 tidak ada; aplikasi memakai nada notifikasi cadangan"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Verifikasi isi APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          unzip -l "$APK" > apk_list.txt
          MP3=$(grep -c 'assets/murottal/[0-9]*\.mp3' apk_list.txt || true)
          echo "Audio murottal di APK: $MP3 dari 114"
          grep -q 'assets/doa.json' apk_list.txt && echo "doa.json: ADA" || echo "doa.json: TIDAK ADA"
          for f in subuh_khalaf subuh_malmo reguler_khalaf_1 reguler_khalaf_2 reguler_azeez; do
            grep -q "assets/adzan/$f.mp3" apk_list.txt && echo "adzan $f: ADA" || echo "::warning::adzan $f TIDAK ADA di APK"
          done
          grep -q 'assets/adzan/reguler_' apk_list.txt || echo "::warning::Zuhur/Asar/Magrib/Isya TANPA file adzan di APK"
          grep -q 'assets/adzan.mp3' apk_list.txt && echo "adzan.mp3: ADA" || echo "adzan.mp3: TIDAK ADA"
          grep -c 'assets/quran' apk_list.txt || true
          if [ "$MP3" -ne 114 ]; then echo "::error::Audio murottal di APK hanya $MP3 dari 114"; exit 1; fi
          if [ "${{ github.event_name }}" = "release" ]; then
            grep -q 'assets/adzan/subuh_' apk_list.txt || { echo "::error::Release dibatalkan: adzan Subuh tidak ada di APK"; exit 1; }
            grep -q 'assets/adzan/reguler_' apk_list.txt || { echo "::error::Release dibatalkan: adzan Zuhur/Asar/Magrib/Isya tidak ada di APK"; exit 1; }
          fi

      - name: Ukuran APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ls -lh app/build/outputs/apk/debug/

      - name: Lampirkan APK ke Release
        if: github.event_name == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "masjidku-$TAG.apk"
          gh release upload "$TAG" "masjidku-$TAG.apk" --clobber --repo "${{ github.repository }}"
          cp app/src/main/assets/adzan/license_check.json "adzan-license-check-$TAG.json" 2>/dev/null \
            && gh release upload "$TAG" "adzan-license-check-$TAG.json" --clobber --repo "${{ github.repository }}" || true

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: masjidku-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Pastikan audio dan doa lengkap
        if: always()
        run: |
          if [ "${{ steps.audio.outcome }}" = "failure" ]; then
            echo "::error::Audio murottal gagal dibundel. APK sudah dibuat tetapi TANPA audio. Lihat log langkah audio."
            exit 1
          fi
          if [ "${{ steps.dua.outcome }}" = "failure" ]; then
            echo "::warning::Data doa dan dzikir gagal diunduh. Menu Doa akan disembunyikan di APK ini."
          fi
          
